name: Apply verified clone refactor

on:
  push:
    branches: [codex/clone-harness-refactor]
    paths: [.github/workflows/apply-clone-refactor.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/clone-harness-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/clone-harness-refactor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact reviewed patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          paths = sorted(Path('.').glob('.clone-refactor.*.b64'))
          assert len(paths) == 4
          text = ''.join(''.join(path.read_text().split()) for path in paths)
          for old, new in [
              ('mi1eol2eag3Gb', 'mi1eol2ag3Gb'),
              ('ngxnGTjGTj/jx', 'ngxnGTj/jx'),
              ('nv7ml6', 'nv7p6YuXT3//8nnTPW2tZ9fx7ml6'),
              ('WkUqXFSVqxQdS8qKTk2FiwXFSVqxQdS8qKTk2Fiw6n', 'WkUqXFSVqxQdS8qKTk2Fiw6n'),
              ('NLZSjIzPCOqDtieNLbpTGlvKpdtQk3NLZSjIzPCOqDtieNLbpTGlv0', 'NLZSjIzPCOqDtieNLbpTGlv0'),
              ('0aLfGQZ/urap', '0aLfGQ+6cQZ/urap'),
          ]:
              text = text.replace(old, new)
          data = gzip.decompress(base64.b64decode(text, validate=True))
          digest = hashlib.sha256(data).hexdigest()
          print('Patch SHA256:', digest)
          assert digest == 'eb5060a3292ff40350a9f78d69b3cf89dd0583f6d433b7f23a88a36dd26f3ea5'
          Path('/tmp/clone.patch').write_bytes(data)
          PY
          git apply --check --exclude='.github/workflows/*' /tmp/clone.patch
          git apply --exclude='.github/workflows/*' /tmp/clone.patch
          rm .clone-refactor.*.b64
      - name: Install and verify refactor
        run: |
          python -m pip install . pytest ruff
          PYTHONPATH=src python -m pytest -q
          ruff check .
          ruff format --check .
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'refactor: expose Python-first clone and simplify copy pipeline'
          git push origin HEAD:codex/clone-harness-refactor
