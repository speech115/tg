name: Clone regression

on:
  push:
    branches: [codex/clone-harness-refactor]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install . pytest ruff
      - name: Tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Installed wheel surface
        working-directory: /tmp
        run: |
          python -c "from tg.clone import clone, run, Store; assert callable(clone) and callable(run)"
          tg skill
          python -m tg.clone --help
