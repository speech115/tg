name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff build
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m build
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/smoke_test.py"
