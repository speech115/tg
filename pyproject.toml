[project]
name = "tg"
version = "0.1.0"
description = "Thin authenticated Telegram runtime on top of Telethon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon==1.44.0",
]

[project.scripts]
tg = "tg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
