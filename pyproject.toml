[project]
name = "tg-harness"
version = "0.1.1"
description = "Tiny authenticated Telegram harness for Telethon workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "speech115" },
]
keywords = ["telegram", "telethon", "cli", "automation", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "telethon==1.44.0",
]

[project.urls]
Homepage = "https://github.com/speech115/tg"
Repository = "https://github.com/speech115/tg"
Issues = "https://github.com/speech115/tg/issues"

[project.scripts]
tg = "tg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg"]
force-include = { "skills/tg/SKILL.md" = "tg/SKILL.md" }

[tool.hatch.build.targets.sdist]
force-include = { "skills/tg/SKILL.md" = "skills/tg/SKILL.md" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
